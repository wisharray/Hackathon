<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpotScout</title>
<style>
  #map-wrap { margin: 0 0 28px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  #map { display: block; width: 100%; height: 380px; border: 0; }
  #map-caption { margin: 0; padding: 8px 12px; font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); }
  @media (max-width: 480px) { #map { height: 300px; } }
  :root {
    --bg: #f3f5f1;
    --ink: #1d2a24;
    --muted: #5d6b63;
    --accent: #003262;
    --gold: #fdb515;
    --line: #d5dbd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Fraunces", serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; color: var(--accent); }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  button, .btn {
    font: inherit;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 12px 18px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #status { margin: 18px 0; color: var(--muted); font-family: system-ui, sans-serif; }
  #result { display: none; border-left: 6px solid var(--gold); background: #fff; padding: 18px 20px; margin-bottom: 20px; }
  #result h2 { margin: 0 0 4px; font-size: 1.4rem; }
  #result .addr, #result .dist { margin: 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: .95rem; }
  #result .btn { margin-top: 14px; }
  #list-title { font-size: 1rem; margin: 0 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; font-family: system-ui, sans-serif; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li span:last-child { color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
    <nav style="background: #fff; border-bottom: 1px solid #d5dbd4; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; font-family: system-ui, sans-serif;"> <span style="font-weight: bold; color: #003262; font-size: 1.1rem;"> SpotScout Berkeley</span> <a href="tutoring.html" style="font-family: system-ui, sans-serif; font-weight: 600; background: #fdb515; color: #1d2a24; border: 0; border-radius: 6px; padding: 8px 14px; text-decoration: none; font-size: 0.9rem;"> Find Nearest Tutor</a> </nav> 
<main>
  <h1>What's the closest study spot to you?</h1>
  <p class="sub">Share your location and get walking directions to the nearest spot on the Berkeley campus.</p>

  <button id="locate">Find my nearest spot</button>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="result" aria-live="polite">
    <h2 id="r-name"></h2>
    <p class="addr" id="r-addr"></p>
    <p class="dist" id="r-dist"></p>
    <a class="btn" id="r-dir" target="_blank" rel="noopener">Get walking directions</a>
  </section>
  <section id="map-wrap">
  <iframe id="map" title="Map of Berkeley campus study spots" src="https://www.google.com/maps?q=37.8719,-122.2585&z=15&output=embed" loading="lazy"allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <p id="map-caption">Berkeley campus. Find your nearest spot to see a walking route here.</p>
</section>
  <h3 id="list-title" hidden>All spots by distance</h3>
  <ul id="all"></ul>
  
</main>

<script>

const SPOTS = [
  { name: "Bancroft Library", address: "Doe Library, University of California, Berkeley, CA 94720", lat: 37.87215, lng: -122.25975 },
  { name: "Environmental Design Library", address: "210 Wurster Hall, Berkeley, CA 94720", lat: 37.87062, lng: -122.25477 },
  { name: "Main (Gardner) Stacks", address: "Doe Library, Berkeley, CA 94720", lat: 37.87232, lng: -122.25938 },
  { name: "Morrison Library", address: "101 Doe Library, Berkeley, CA 94720", lat: 37.87232, lng: -122.25938 },
  { name: "Art History/Classics Library", address: "308 Doe Library, Berkeley, CA 94720", lat: 37.87232, lng: -122.25938 },
  { name: "Marian Koshland Bioscience, Natural Resources & Public Health Library", address: "2101 Valley Life Sciences Bldg, Berkeley, CA 94720", lat: 37.87150, lng: -122.26210 },
  { name: "Thomas J. Long Business and Economics Library", address: "S540 Student Services Bldg, Haas School of Business, Berkeley, CA 94720", lat: 37.87140, lng: -122.25330 },
  { name: "Ethnic Studies Library", address: "30 Stephens Hall, Berkeley, CA 94720", lat: 37.87148, lng: -122.25760 },
  { name: "Chemistry, Astronomy & Physics Library", address: "100 Hildebrand Hall, Berkeley, CA 94720", lat: 37.87220, lng: -122.25580 },
  { name: "Earth Sciences & Map Library", address: "50 McCone Hall, Berkeley, CA 94720", lat: 37.87370, lng: -122.25950 },
  { name: "Institute of Governmental Studies Library", address: "109 Moses Hall, Berkeley, CA 94720", lat: 37.87110, lng: -122.25850 },
  { name: "C.V. Starr East Asian Library", address: "1 Starr East Asian Library Bldg, Berkeley, CA 94720", lat: 37.87340, lng: -122.25940 },
  { name: "Grimes Engineering Library", address: "110 Bechtel Engineering Center, Berkeley, CA 94720", lat: 37.87410, lng: -122.25830 },
  { name: "Graduate Services", address: "208 Doe Library, Berkeley, CA 94720", lat: 37.87232, lng: -122.25938 },
  { name: "Newspapers & Microforms Library", address: "40 Doe Library, Berkeley, CA 94720", lat: 37.87232, lng: -122.25938 },
  { name: "Jean Gray Hargrove Music Library", address: "1 Hargrove Music Library, Berkeley, CA 94720", lat: 37.87090, lng: -122.25560 },
  { name: "Social Research Library", address: "227 Haviland Hall, Berkeley, CA 94720", lat: 37.87320, lng: -122.26050 },
  { name: "South/Southeast Asia Library", address: "120 Doe Library, Berkeley, CA 94720", lat: 37.87232, lng: -122.25938 } 
];

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmt(m) {
  return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km";
}

function dirUrl(from, to) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + from.lat + "," + from.lng +
         "&destination=" + to.lat + "," + to.lng + "&travelmode=walking";
}
function embedRouteUrl(from, to) {
  return "https://maps.google.com/maps?saddr=" + from.lat + "," + from.lng + "&daddr=" + to.lat + "," + to.lng + "&dirflg=w&output=embed";
}

const statusEl = document.getElementById("status");

function show(user) {
  const ranked = SPOTS
    .map(s => ({ ...s, dist: haversine(user.lat, user.lng, s.lat, s.lng) }))
    .sort((a, b) => a.dist - b.dist);
  const best = ranked[0];

  document.getElementById("r-name").textContent = best.name;
  document.getElementById("r-addr").textContent = best.address;
  document.getElementById("r-dist").textContent = fmt(best.dist) + " away (straight line)";
  document.getElementById("r-dir").href = dirUrl(user, best);
  document.getElementById("result").style.display = "block";
  
  document.getElementById("map").src = embedRouteUrl(user, best);
  document.getElementById("map-caption").textContent = "Walking route to " + best.name + ".";

  const ul = document.getElementById("all");
  ul.innerHTML = "";
  ranked.forEach(s => {
    const li = document.createElement("li");
    const a = document.createElement("span");
    a.textContent = s.name;
    const b = document.createElement("span");
    b.textContent = fmt(s.dist);
    li.append(a, b);
    ul.appendChild(li);
  });
  document.getElementById("list-title").hidden = false;
  statusEl.textContent = "";
}

document.getElementById("locate").addEventListener("click", () => {
  if (!navigator.geolocation) {
    statusEl.textContent = "Your browser does not support location, maybe try using a different browser.";
    return;
  }
  statusEl.textContent = "Finding your location...";
  navigator.geolocation.getCurrentPosition(
    pos => show({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
    err => {
      statusEl.textContent = err.code === 1
        ? "Location access was denied. Allow location for this site in your browser settings and try again."
        : "Could not get your location. Check your connection and try again.";
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
});
</script>
</body>
</html>
