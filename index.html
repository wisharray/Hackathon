<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpotScout</title>
<style>
  :root {
    --bg: #f3f5f1;
    --ink: #1d2a24;
    --muted: #5d6b63;
    --accent: #003262;
    --gold: #fdb515;
    --line: #d5dbd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; color: var(--accent); }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  button, .btn {
    font: inherit;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 12px 18px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #status { margin: 18px 0; color: var(--muted); font-family: system-ui, sans-serif; }
  #result { display: none; border-left: 6px solid var(--gold); background: #fff; padding: 18px 20px; margin-bottom: 28px; }
  #result h2 { margin: 0 0 4px; font-size: 1.4rem; }
  #result .addr, #result .dist { margin: 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: .95rem; }
  #result .btn { margin-top: 14px; }
  #list-title { font-size: 1rem; margin: 0 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; font-family: system-ui, sans-serif; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li span:last-child { color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>What's the closest study spot to you?</h1>
  <p class="sub">Share your location and get walking directions to the nearest spot on the Berkeley campus.</p>

  <button id="locate">Find my nearest spot</button>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="result" aria-live="polite">
    <h2 id="r-name"></h2>
    <p class="addr" id="r-addr"></p>
    <p class="dist" id="r-dist"></p>
    <a class="btn" id="r-dir" target="_blank" rel="noopener">Get walking directions</a>
  </section>

  <h3 id="list-title" hidden>All spots by distance</h3>
  <ul id="all"></ul>
</main>

<script>

const SPOTS = [
  { name: "Moffitt Library",        address: "350 Moffitt Library, Berkeley, CA 94720", lat: 37.87248, lng: -122.26086 },
  { name: "Doe Library",            address: "Doe Library, Berkeley, CA 94720",          lat: 37.87250, lng: -122.25940 },
  { name: "Kresge Engineering Library", address: "110 Bechtel Engineering Center, Berkeley, CA 94720", lat: 37.87390, lng: -122.25890 },
  { name: "Main Stacks / Morrison",  address: "Morrison Library, Berkeley, CA 94720",    lat: 37.87290, lng: -122.25985 },
  { name: "Cafe Strada",            address: "2300 College Ave, Berkeley, CA 94704",    lat: 37.86795, lng: -122.25965 }
];

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmt(m) {
  return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km";
}

function dirUrl(from, to) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + from.lat + "," + from.lng +
         "&destination=" + to.lat + "," + to.lng + "&travelmode=walking";
}

const statusEl = document.getElementById("status");

function show(user) {
  const ranked = SPOTS
    .map(s => ({ ...s, dist: haversine(user.lat, user.lng, s.lat, s.lng) }))
    .sort((a, b) => a.dist - b.dist);
  const best = ranked[0];

  document.getElementById("r-name").textContent = best.name;
  document.getElementById("r-addr").textContent = best.address;
  document.getElementById("r-dist").textContent = fmt(best.dist) + " away (straight line)";
  document.getElementById("r-dir").href = dirUrl(user, best);
  document.getElementById("result").style.display = "block";

  const ul = document.getElementById("all");
  ul.innerHTML = "";
  ranked.forEach(s => {
    const li = document.createElement("li");
    const a = document.createElement("span");
    a.textContent = s.name;
    const b = document.createElement("span");
    b.textContent = fmt(s.dist);
    li.append(a, b);
    ul.appendChild(li);
  });
  document.getElementById("list-title").hidden = false;
  statusEl.textContent = "";
}

document.getElementById("locate").addEventListener("click", () => {
  if (!navigator.geolocation) {
    statusEl.textContent = "Your browser does not support location. Try a different browser.";
    return;
  }
  statusEl.textContent = "Finding your location...";
  navigator.geolocation.getCurrentPosition(
    pos => show({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
    err => {
      statusEl.textContent = err.code === 1
        ? "Location access was denied. Allow location for this site in your browser settings and try again."
        : "Could not get your location. Check your connection and try again.";
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
});
</script>
</body>
</html>
