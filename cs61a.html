<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS61A Live Help Finder | Berkeley</title>
    <!-- Tailwind CSS for fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">🐻 CS61A Live Help Finder</h1>
                <p class="text-blue-200 text-sm">Find in-person office hours & tutoring happening right now</p>
            </div>
            <div id="live-clock" class="text-right text-sm bg-blue-800 px-3 py-2 rounded-lg border border-blue-700">
                <!-- JS will inject current time -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Quick Filter Banner -->
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 mb-6 rounded-r-lg shadow-sm">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <div>
                    <h2 class="font-bold text-amber-800">Status: Looking for help today?</h2>
                    <p class="text-sm text-amber-700">Showing active and upcoming staff for today.</p>
                </div>
                <button onclick="filterHappeningNow()" class="bg-amber-600 hover:bg-amber-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
                    ⚡ Happening Right Now
                </button>
            </div>
        </div>

        <!-- Office Hours List Container -->
        <div id="oh-list" class="space-y-4">
            <!-- JS will inject cards here -->
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Mock database of CS61A Office Hours / Help spots
        const officeHours = [
            {
                staff: "TA Alex & TA Jessica",
                type: "Project / Homework Help",
                location: "Warren Hall 101B",
                building: "Warren Hall",
                startTime: "14:00", // 2:00 PM
                endTime: "17:00",   // 5:00 PM
                fullness: "Packed (15 min wait)",
                day: "Friday"
            },
            {
                staff: "Prof. John DeNero",
                type: "Conceptual Office Hours",
                location: "Wheeler 210",
                building: "Wheeler Hall",
                startTime: "13:00", 
                endTime: "14:00",   
                fullness: "Moderate",
                day: "Friday"
            },
            {
                staff: "Academic Interns (Tutor Drop-in)",
                type: "General Help & Bug Debugging",
                location: "Soda Hall 275 (CS Lounge)",
                building: "Soda Hall",
                startTime: "16:00", 
                endTime: "19:00",   
                fullness: "Empty (Walk right in!)",
                day: "Friday"
            }
        ];

        function displayOH(items) {
            const container = document.getElementById('oh-list');
            container.innerHTML = '';

            if(items.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm text-center text-slate-500">No office hours found matching this filter. Try checking regular study spots!</div>`;
                return;
            }

            items.forEach(oh => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded">${oh.type}</span>
                                <span class="text-xs text-slate-400">📅 ${oh.day}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900">${oh.staff}</h3>
                            <p class="text-slate-600 font-medium text-sm flex items-center gap-1 mt-1">
                                📍 <span class="text-blue-600 underline">${oh.location}</span>
                            </p>
                        </div>
                        <div class="flex flex-col items-end gap-2 w-full md:w-auto">
                            <span class="text-sm font-semibold text-slate-700 bg-slate-100 px-3 py-1 rounded-md">
                                🕒 ${oh.startTime} - ${oh.endTime}
                            </span>
                            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${
                                oh.fullness.includes('Packed') ? 'bg-red-100 text-red-700' : 
                                oh.fullness.includes('Moderate') ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'
                            }">
                                🔥 ${oh.fullness}
                            </span>
                        </div>
                    </div>
                `;
            });
        }

        // Live clock display
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerHTML = `Current Time:<br><strong>${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong>`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simple filter logic (for hackathon demo purposes)
        function filterHappeningNow() {
            // For demo, just display all active mock items or filter them
            displayOH(officeHours);
        }

        // Initial load
        displayOH(officeHours);
    </script>
</body>
</html>
