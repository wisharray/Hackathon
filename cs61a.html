<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS61A & Engineering Help Finder | Study Scout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header with Navigation Back to Study Scout -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <a href="index.html" class="text-blue-300 hover:text-white text-xs font-semibold uppercase tracking-wider">← Back to Study Scout Home</a>
                <h1 class="text-2xl font-bold mt-1">🐻 CS61A & Co. Live Help Finder</h1>
            </div>
            <div id="live-clock" class="text-right text-xs bg-blue-800 px-3 py-2 rounded-lg border border-blue-700">
                <!-- JS Live Clock -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Intro Banner -->
        <div class="bg-blue-50 border-l-4 border-blue-600 p-4 mb-6 rounded-r-lg shadow-sm">
            <h2 class="font-bold text-blue-900">Live Tutoring & Office Hours Hub</h2>
            <p class="text-sm text-blue-700">Stuck on a bug or project concept? Check out live physical locations for CS61A, CAEE, HKN, and RTP below.</p>
        </div>

        <!-- Tutoring Resource Cards Container -->
        <div id="resources-list" class="space-y-4">
            <!-- JS will inject resources here -->
        </div>

    </main>

    <script>
        // Master database of your gathered tutoring resources
        const helpResources = [
            {
                name: "CS61A Staff Office Hours",
                category: "Course-Specific",
                location: "Soda Hall 275 & Wheeler Hall",
                hours: "Mon-Fri: 1:00 PM - 5:00 PM",
                status: "Open Now",
                link: "https://cs61a.org/fa26/calendar/",
                badgeColor: "bg-purple-100 text-purple-800"
            },
            {
                name: "Center for Access to Engineering Excellence (CAEE)",
                category: "General Engineering & Math",
                location: "325 Davis Hall",
                hours: "Mon-Fri: 10:00 AM - 6:00 PM",
                status: "Open Now",
                link: "https://engineering.berkeley.edu/students/academic-support/tutoring/",
                badgeColor: "bg-blue-100 text-blue-800"
            },
            {
                name: "HKN (Eta Kappa Nu) Honor Society Tutoring",
                category: "EECS Peer Tutoring",
                location: "Cory / Soda Hall Lounges",
                hours: "Check schedule online for drop-ins",
                status: "Check Website",
                link: "https://hkn.eecs.berkeley.edu/tutor",
                badgeColor: "bg-amber-100 text-amber-800"
            },
            {
                name: "Residential Tutoring Program (RTP)",
                category: "Gateway Courses (Math/Sci)",
                location: "Unit 1, 2, 3 Academic Centers",
                hours: "Sun-Thu: 6:00 PM - 11:00 PM",
                status: "Opens at 6 PM",
                link: "https://docs.google.com/document/d/1fJWHvzg7yeglA7cfjrq-qYWhItaRP9oOMgqlYxenH0E/edit?tab=t.0",
                badgeColor: "bg-green-100 text-green-800"
            }
        ];

        function renderResources() {
            const container = document.getElementById('resources-list');
            container.innerHTML = '';

            helpResources.forEach(res => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-md transition">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="${res.badgeColor} text-xs font-bold px-2.5 py-0.5 rounded">${res.category}</span>
                                <span class="text-xs text-slate-500 font-medium">📍 ${res.location}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900">${res.name}</h3>
                            <p class="text-slate-600 text-sm mt-1">🕒 ${res.hours}</p>
                        </div>
                        <div class="flex flex-col items-end gap-2 w-full md:w-auto">
                            <span class="text-xs px-3 py-1 rounded-full font-semibold bg-emerald-100 text-emerald-800">
                                🟢 ${res.status}
                            </span>
                            <a href="${res.link}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm text-center">
                                View Official Schedule →
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerHTML = `Current Time:<br><strong>${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong>`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        renderResources();
    </script>
</body>
</html>
