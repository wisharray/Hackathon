<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Nearest Tutor | SpotScout</title>
<style>
  :root {
    --bg: #f3f5f1;
    --ink: #1d2a24;
    --muted: #5d6b63;
    --accent: #003262;
    --gold: #fdb515;
    --line: #d5dbd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  /* Top Navigation Bar */
  nav {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: system-ui, sans-serif;
  }
  .nav-brand {
    font-weight: bold;
    color: var(--accent);
    font-size: 1.1rem;
    text-decoration: none;
  }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 8px; color: var(--accent); }
  p.sub { margin: 0 0 28px; color: var(--muted); font-family: system-ui, sans-serif; }
  
  /* Live Clock Widget */
  #live-clock {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    color: #fff;
    text-align: right;
  }

  /* Filter & Sort Bar */
  .filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
    font-family: system-ui, sans-serif;
  }
  .filters { display: flex; gap: 8px; }
  button, .btn {
    font: inherit;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 0.9rem;
  }
  button.secondary {
    background: #e2e8e0;
    color: var(--ink);
  }
  button.secondary:hover { background: #d0d8ce; }
  button.gold-btn {
    background: var(--gold);
    color: var(--ink);
  }
  button:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Tutor Cards */
  .tutor-card {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 6px solid var(--accent);
    padding: 20px;
    margin-bottom: 16px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tutor-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .tutor-card h2 { margin: 0 0 4px; font-size: 1.3rem; color: var(--ink); font-family: Georgia, serif; }
  
  .badge {
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .badge-61a { background: #dbeafe; color: #1e40af; } /* Blue for 61A */
  .badge-61b { background: #fce7f3; color: #9d174d; } /* Pink for 61B */
  .badge-gen { background: #e5e7eb; color: #374151; } /* Grey for General */

  /* Status Pill Style matching your screenshot */
  .status-pill {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    font-weight: bold;
    background: #d1fae5;
    color: #065f46;
    padding: 6px 14px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  }

  .tutor-meta {
    margin: 0;
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 0.92rem;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .tutor-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
  }
  #status-msg { margin: 18px 0; color: var(--muted); font-family: system-ui, sans-serif; }
</style>
</head>
<body style="background: var(--bg);">

<!-- Top Navigation Bar -->
<nav>
  <a href="index.html" class="nav-brand"> SpotScout Berkeley</a>
  <div style="display: flex; align-items: center; gap: 12px;">
    <div id="live-clock">Loading time...</div>
    <a href="index.html" class="btn gold-btn" style="padding: 8px 12px; font-size: 0.85rem;">← Study Spots</a>
  </div>
</nav>

<main>
  <h1>Find the Nearest Tutor</h1>
  <p class="sub">Filter by course or check live availability to get help right now.</p>

  <!-- Filter & Sort Bar -->
  <div class="filter-bar">
    <div class="filters">
      <button onclick="filterCourse('all')" id="btn-all">All</button>
      <button onclick="filterCourse('61A')" class="secondary" id="btn-61a">CS61A</button>
      <button onclick="filterCourse('61B')" class="secondary" id="btn-61b">CS61B</button>
    </div>
    <button onclick="sortNearest()" class="gold-btn">⚡ Sort by Nearest</button>
  </div>

  <div id="status-msg" role="status" aria-live="polite"></div>

  <!-- Tutor List Container -->
  <div id="tutor-container"></div>
</main>

<script>
const TUTORS = [
  {
    name: "CS61A Staff Drop-in Hours",
    course: "61A",
    badgeClass: "badge-61a",
    location: "Soda Hall 275 (CS Lounge)",
    time: "1:00 PM - 5:00 PM",
    statusText: "Open Now",
    distance: "0.3 miles away",
    link: "https://cs61a.org/fa26/calendar/"
  },
  {
    name: "CS61B Data Structures Lab Mentors",
    course: "61B",
    badgeClass: "badge-61b",
    location: "Soda Hall 311 / Cory Hall",
    time: "2:00 PM - 6:00 PM",
    statusText: "Open Now",
    distance: "0.4 miles away",
    link: "https://sp24.datastructur.es/"
  },
  {
    name: "Center for Access to Engineering Excellence (CAEE)",
    course: "General",
    badgeClass: "badge-gen",
    location: "325 Davis Hall",
    time: "Open until 6:00 PM",
    statusText: "Check Website",
    distance: "0.6 miles away",
    link: "https://engineering.berkeley.edu/students/academic-support/tutoring/"
  },
  {
    name: "HKN Honor Society Tutoring",
    course: "61B",
    badgeClass: "badge-61b",
    location: "Cory Hall Mezzanine",
    time: "Drop-in Afternoon Hours",
    statusText: "Opens at 6 PM",
    distance: "0.4 miles away",
    link: "https://hkn.eecs.berkeley.edu/tutor"
  }
];

function renderTutors(list) {
  const container = document.getElementById("tutor-container");
  container.innerHTML = "";

  list.forEach(t => {
    container.innerHTML += `
      <div class="tutor-card">
        <div class="tutor-header">
          <div>
            <span class="badge ${t.badgeClass}">CS ${t.course}</span>
            <h2>${t.name}</h2>
          </div>
          <div class="status-pill">
            <span class="status-dot"></span>
            ${t.statusText}
          </div>
        </div>
        <p class="tutor-meta">
          <span>📍 ${t.location}</span>
          <span>🕒 ${t.time}</span>
        </p>
        <div class="tutor-footer">
          <span style="color: var(--muted)">🚶‍♂️ ${t.distance}</span>
          <a class="btn" href="${t.link}" target="_blank" rel="noopener" style="padding: 6px 14px; font-size: 0.85rem; background: var(--accent);">Official Schedule →</a>
        </div>
      </div>
    `;
  });
}

function filterCourse(code) {
  document.getElementById("btn-all").className = code === 'all' ? '' : 'secondary';
  document.getElementById("btn-61a").className = code === '61A' ? '' : 'secondary';
  document.getElementById("btn-61b").className = code === '61B' ? '' : 'secondary';

  if(code === 'all') {
    renderTutors(TUTORS);
  } else {
    const filtered = TUTORS.filter(t => t.course === code || t.course === "General");
    renderTutors(filtered);
  }
}

function sortNearest() {
  const sorted = [...TUTORS].sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
  renderTutors(sorted);
  document.getElementById("status-msg").textContent = "Sorted by proximity!";
}

// Live Clock Script
function updateClock() {
  const now = new Date();
  document.getElementById('live-clock').innerHTML = `Current Time:<br><strong>${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</strong>`;
}
setInterval(updateClock, 1000);
updateClock();

// Initial render
renderTutors(TUTORS);
</script>
</body>
</html>
